name: Build Site Preview

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: "site-preview-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HUGO_VERSION: 0.154.5

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      # Hugo is not a package.json dependency in this repo, so it has to be
      # installed here. Dart Sass is not installed separately: hugo_extended
      # has embedded it since v0.114.
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Only supplies the PostCSS toolchain; tolerant of a missing lockfile.
      - name: Install dependencies
        run: '[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true'

      - name: Build PR preview
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_PREVIEW: "true"
        run: |
          hugo \
            --gc \
            --minify \
            --buildDrafts \
            --buildFuture \
            --baseURL "/"

          # Block all crawlers from indexing PR previews
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Disallow: /
          EOF

      - name: Save PR Metadata
        run: |
          mkdir -p pr
          echo "${{ github.event.action }}" > pr/action
          echo "${{ github.event.number }}" > pr/number
          echo "${{ github.event.pull_request.head.sha }}" > pr/sha

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview-build
          path: |
            public/
            pr/
          if-no-files-found: error
          retention-days: 7